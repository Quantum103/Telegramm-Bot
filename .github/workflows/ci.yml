name: CI

on:
  push:
    branches:
      - main
      - "stage-2/**"
      - "stage-3/**"
      - "stage-4.1/**"
      - "stage-4.2/**"
      - "stage-4.3/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "stage-3/**"
      - "stage-4.1/**"
      - "stage-4.3/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Go tests and PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bible_platform_test
          POSTGRES_USER: bible_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bible_app -d bible_platform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://bible_app:ci-only-password@127.0.0.1:5432/bible_platform_test?sslmode=disable
      MIGRATIONS_DATABASE_URL: postgres://bible_migrator:ci-migrations-password@127.0.0.1:5432/bible_platform_test?sslmode=disable
      RUNTIME_DATABASE_URL: postgres://bible_runtime:ci-runtime-password@127.0.0.1:5432/bible_platform_test?sslmode=disable
      UPGRADE_DATABASE_URL: postgres://bible_app:ci-only-password@127.0.0.1:5432/bible_platform_upgrade_test?sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check Go module metadata
        working-directory: backend
        run: go mod tidy -diff

      - name: Prepare an existing SERIAL sequence for role-bootstrap regression
        run: |
          docker run --rm --network host postgres:18-alpine \
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "CREATE TABLE public.bootstrap_sequence_fixture (id BIGSERIAL PRIMARY KEY)"

      - name: Create a legacy schema and migration ledger as the bootstrap role
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1 \
            -path=/migrations \
            -database "$TEST_DATABASE_URL" \
            goto 11

      - name: Provision PostgreSQL least-privilege roles
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/bootstrap:/bootstrap:ro" \
            -e PGPASSWORD=ci-only-password \
            postgres:18-alpine \
            psql --host=127.0.0.1 --username=bible_app --dbname=bible_platform_test \
              --set=bootstrap_user=bible_app \
              --set=runtime_password=ci-runtime-password \
              --set=migrations_password=ci-migrations-password \
              --file=/bootstrap/001_roles.sql

      - name: Verify owned SERIAL sequence follows its table owner
        run: |
          set -euo pipefail
          owners="$(docker run --rm --network host postgres:18-alpine \
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT pg_get_userbyid(t.relowner) || '|' || pg_get_userbyid(s.relowner) || '|' || pg_get_userbyid(m.relowner)
             FROM pg_class t
             JOIN pg_class s ON s.oid = pg_get_serial_sequence('public.bootstrap_sequence_fixture', 'id')::regclass
             JOIN pg_class m ON m.oid = 'public.schema_migrations'::regclass
             WHERE t.oid = 'public.bootstrap_sequence_fixture'::regclass")"
          test "$owners" = "bible_migrator|bible_migrator|bible_migrator"

      - name: Apply SQL migrations using the dedicated migration role
        run: >-
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/backend/db/migrations:/migrations:ro"
          migrate/migrate:v4.20.1
          -path=/migrations
          -database "$MIGRATIONS_DATABASE_URL"
          up

      - name: Verify backend runtime role cannot perform DDL
        run: |
          set -euo pipefail
          role_flags="$(docker run --rm --network host postgres:18-alpine \
            psql "$RUNTIME_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls FROM pg_roles WHERE rolname = current_user")"
          test "$role_flags" = "t"
          dml_rights="$(docker run --rm --network host postgres:18-alpine \
            psql "$RUNTIME_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT has_schema_privilege(current_user, 'public', 'USAGE') AND NOT has_schema_privilege(current_user, 'public', 'CREATE') AND has_table_privilege(current_user, 'public.students', 'SELECT') AND has_table_privilege(current_user, 'public.students', 'INSERT') AND has_table_privilege(current_user, 'public.students', 'UPDATE') AND has_table_privilege(current_user, 'public.students', 'DELETE')")"
          test "$dml_rights" = "t"
          if docker run --rm --network host postgres:18-alpine \
            psql "$RUNTIME_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE public.runtime_role_must_not_create(id INTEGER)"; then
            echo "ERROR: bible_runtime unexpectedly created a table"
            exit 1
          fi

      - name: Verify data-preserving migration upgrade (schema v11 to latest)
        run: |
          set -euo pipefail

          docker run --rm --network host postgres:18-alpine \
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE bible_platform_upgrade_test"

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1 \
            -path=/migrations -database "$UPGRADE_DATABASE_URL" goto 11

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/testdata:/fixtures:ro" \
            postgres:18-alpine psql "$UPGRADE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 -f /fixtures/migration_upgrade_seed_v11.sql

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1 \
            -path=/migrations -database "$UPGRADE_DATABASE_URL" goto 13

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/testdata:/fixtures:ro" \
            postgres:18-alpine psql "$UPGRADE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 -f /fixtures/migration_upgrade_referral_v13.sql

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/migrations:/migrations:ro" \
            migrate/migrate:v4.20.1 \
            -path=/migrations -database "$UPGRADE_DATABASE_URL" up

          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/backend/db/testdata:/fixtures:ro" \
            postgres:18-alpine psql "$UPGRADE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 -f /fixtures/migration_upgrade_assert_v15.sql

      - name: Check Go formatting
        working-directory: backend
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [ -n "$files" ]; then
            echo "Go files need gofmt:"
            echo "$files"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: Check Go module tidy state
        working-directory: backend
        run: go mod tidy -diff

      - name: Run Go tests
        working-directory: backend
        run: go test ./...

      - name: Run PostgreSQL navigation load profiles (1/5/10 students)
        working-directory: backend
        env:
          RUN_LOAD_PROFILE: "1"
          LOAD_PROFILE_ITERATIONS: "1000"
        run: go test ./internal/repository -run TestQuestionNavigationLoadProfiles -count=1 -v

      - name: Run Telegram fake API load and failure profiles
        working-directory: backend
        run: go test ./internal/telegrambot -run 'TestUpdateWorkerPoolLoadProfiles|TestTelegramAPILoadProfiles|TestTelegramHTTPClientHandlesRateLimitServerFailureAndTimeout' -count=1 -v

      - name: Run race tests across all backend packages
        working-directory: backend
        run: go test -race ./...

      - name: Benchmark Telegram update worker pool
        working-directory: backend
        run: go test ./internal/telegrambot -run '^$' -bench '^BenchmarkUpdateWorkerPoolParallel$' -benchtime=30x -count=1

      - name: Benchmark Telegram navigation and student interaction
        working-directory: backend
        run: go test ./internal/repository -run '^$' -bench '^(BenchmarkQuestionNavigationPaths|BenchmarkStudentInteractionExitQueries)$' -benchtime=30x -count=1

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Scan Go dependencies and reachable code for known vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend checks and Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Audit frontend dependencies for known vulnerabilities
        working-directory: web
        run: npm audit --no-package-lock --audit-level=high

      - name: Check TypeScript
        working-directory: web
        run: npm run typecheck

      - name: Build frontend for production
        working-directory: web
        run: npm run build

      - name: Create local environment file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
