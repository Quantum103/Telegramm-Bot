name: Temporary Go formatter inspection

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
      - name: Show exact gofmt changes
        working-directory: backend
        run: |
          gofmt -d ./cmd ./internal
