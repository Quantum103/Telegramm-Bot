services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bible_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-bible_app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в .env}"
    command:
      - sh
      - -ec
      - |
        exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      HTTP_READ_TIMEOUT: "${HTTP_READ_TIMEOUT:-15s}"
      HTTP_READ_HEADER_TIMEOUT: "${HTTP_READ_HEADER_TIMEOUT:-5s}"
      HTTP_WRITE_TIMEOUT: "${HTTP_WRITE_TIMEOUT:-15s}"
      HTTP_IDLE_TIMEOUT: "${HTTP_IDLE_TIMEOUT:-60s}"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${POSTGRES_DB:-bible_platform}"
      DATABASE_USER: "${POSTGRES_USER:-bible_app}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}"
      DATABASE_SSLMODE: "${DATABASE_SSLMODE:-disable}"
      DATABASE_CONNECT_TIMEOUT: "${DATABASE_CONNECT_TIMEOUT:-5s}"
      DATABASE_MAX_CONNS: "${DATABASE_MAX_CONNS:-10}"
      DATABASE_MIN_CONNS: "${DATABASE_MIN_CONNS:-1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в .env}"
      REDIS_DB: "${REDIS_DB:-0}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost.test}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

  migrate:
    image: migrate/migrate:v4.20.1
    profiles: ["tools"]
    volumes:
      - ./backend/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=${MIGRATIONS_DATABASE_URL:-postgres://${POSTGRES_USER:-bible_app}:${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-bible_platform}?sslmode=disable}"
      - "up"

volumes:
  postgres_data:
  redis_data:
